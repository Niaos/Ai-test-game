<!DOCTYPE html>
<html><body style="margin:0;background:#000;display:flex;justify-content:center">
<iframe id="f" src="index.html" style="width:1100px;height:100vh;border:0"></iframe>
<script>
const sw = { log: [] };
function L(m) { sw.log.push(m); console.log('TEST ' + m); }
f.onload = () => {
  setTimeout(() => {
    try {
      const w = f.contentWindow, A = w.__sw.app, D = f.contentDocument;
      const hash = location.hash.slice(1) || 'menu';
      if (hash === 'menu') {
        // 初始值
        L('init size=' + A.settings.size + ' level=' + A.settings.level + ' mode=' + A.settings.mode);
        // 左箭头从 normal(下标1) → small；再左 → large（回绕）
        const btns = D.querySelectorAll('#cycSize .cyc-btn');
        btns[0].click(); L('size left1 = ' + A.settings.size + ' / 显示: ' + D.getElementById('cycSizeVal').textContent);
        btns[0].click(); L('size left2 = ' + A.settings.size + ' / 显示: ' + D.getElementById('cycSizeVal').textContent);
        btns[1].click(); L('size right1 = ' + A.settings.size + '（应回绕回 small）');
        // 等级从 normal 右 → hard，再右 → easy（回绕）
        const lb = D.querySelectorAll('#cycLevel .cyc-btn');
        lb[1].click(); L('level right1 = ' + A.settings.level);
        lb[1].click(); L('level right2 = ' + A.settings.level + '（应回绕回 easy）');
        // 模式循环 + 文案
        const mb = D.querySelectorAll('#cycMode .cyc-btn');
        mb[1].click(); L('mode right1 = ' + A.settings.mode + ' / ' + D.getElementById('cycModeVal').textContent);
        mb[1].click(); L('mode right2 = ' + A.settings.mode);
        mb[1].click(); L('mode right3 = ' + A.settings.mode + '（应回到 mouse）');
        L('CTA text = ' + D.getElementById('btnStart').textContent.trim());
        // 持久化
        const saved = JSON.parse(w.localStorage.getItem('sw.settings.v1') || '{}');
        L('persisted size=' + (saved.size || JSON.stringify(Object.keys(saved))));
      }
      setTimeout(() => console.log('TEST DONE ' + JSON.stringify(sw.log.length)), 300);
    } catch (e) { console.log('TEST ERROR ' + e.message); }
  }, 1500);
};
</script></body></html>
